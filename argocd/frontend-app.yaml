apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:ameya018/three-tier-gitops.git
    targetRevision: main
    path: frontend

  destination:
    server: https://kubernetes.default.svc
    namespace: three-tier

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
