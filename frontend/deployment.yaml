apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: three-tier

spec:
  replicas: 3

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend

        image: 610269527042.dkr.ecr.ap-south-1.amazonaws.com/three-tier/frontend:24

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 300m
            memory: 256Mi
