apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: 610269527042.dkr.ecr.ap-south-1.amazonaws.com/three-tier/backend:9

        imagePullPolicy: Always

        ports:
        - containerPort: 3500
